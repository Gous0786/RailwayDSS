<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRAVAH — KTV–PSA corridor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1117'/%3E%3Cpath d='M2 12L8 7l6-3' stroke='%2358a6ff' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3;
    --dim:#8b949e; --rail:#5a6673; --station:#f0f6fc;
    --dn:#4aa8ff; --up:#ffb84a; --freight:#3fb950; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #map{position:absolute;inset:0}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:12px 14px}
  #hud{top:12px;left:12px;min-width:250px}
  #hud h1{margin:0 0 2px;font-size:14px;letter-spacing:.04em}
  #hud .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  #clock{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #clock small{font-size:11px;color:var(--dim);margin-left:6px}
  .row{display:flex;gap:8px;align-items:center;margin-top:9px}
  button{background:#21262d;color:var(--text);border:1px solid var(--line);
    border-radius:5px;padding:5px 11px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .stat{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
  .stat b{color:var(--text);font-weight:600}
  #legend{bottom:30px;left:12px;font-size:11px}
  #legend div{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--dim)}
  .sw{width:14px;height:3px;border-radius:2px}
  .dot{width:9px;height:9px;border-radius:50%}
  #info{top:12px;right:12px;width:230px;display:none}
  #info h2{margin:0 0 6px;font-size:13px}
  #info .kv{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin:2px 0}
  #info .kv b{color:var(--text);font-weight:600}
  .maplibregl-ctrl-attrib{background:rgba(13,17,23,.85)!important;color:var(--dim)!important}
  .maplibregl-ctrl-attrib a{color:var(--dim)!important}
  #loading{position:absolute;inset:0;display:grid;place-items:center;
    background:var(--bg);z-index:9;color:var(--dim)}
  .stn-label{font:10px/1 ui-monospace,Menlo,Consolas,monospace;color:#9fb0c3;
    white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #0d1117,0 0 3px #0d1117}
  .stn-label.major{font-size:11px;font-weight:700;color:#f0f6fc}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">loading corridor…</div>

<div class="panel" id="hud">
  <h1>PRAVAH</h1>
  <div class="sub">Kottavalasa Jn → Palasa · 176.83 km</div>
  <div id="clock">--:--<small id="daytag"></small></div>
  <input type="range" id="scrub" min="0" max="95400" step="30" value="21600">
  <div class="row">
    <a href="graph.html" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;
       border-radius:5px;padding:5px 11px;text-decoration:none;font:inherit">train graph →</a>
  </div>
  <div class="row">
    <button id="play">▶ play</button>
    <button class="spd" data-s="60">60×</button>
    <button class="spd on" data-s="300">300×</button>
    <button class="spd" data-s="900">900×</button>
  </div>
  <div class="row" style="display:block">
    <div class="stat"><span>running</span><b id="nrun">0</b></div>
    <div class="stat"><span>down / up</span><b id="ndir">0 / 0</b></div>
    <div class="stat"><span>replay day</span><b id="nday">—</b></div>
    <div class="stat"><span>feed</span><b id="nfeed">—</b></div>
  </div>
</div>

<div class="panel" id="info">
  <h2 id="i-id">—</h2>
  <div class="kv"><span>type</span><b id="i-type">—</b></div>
  <div class="kv"><span>direction</span><b id="i-dir">—</b></div>
  <div class="kv"><span>chainage</span><b id="i-km">—</b></div>
  <div class="kv"><span>speed</span><b id="i-spd">—</b></div>
  <div class="kv"><span>between</span><b id="i-seg">—</b></div>
</div>

<div class="panel" id="legend">
  <div><span class="sw" style="background:var(--rail)"></span> running line</div>
  <div><span class="dot" style="background:var(--station)"></span> station</div>
  <div><span class="dot" style="background:var(--dn)"></span> down (KTV→PSA)</div>
  <div><span class="dot" style="background:var(--up)"></span> up (PSA→KTV)</div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>
function fail(msg){
  const el = document.getElementById("loading");
  if (el){ el.style.display="grid"; el.style.padding="24px";
           el.style.textAlign="center"; el.style.whiteSpace="pre-wrap";
           el.textContent = String(msg); }
  console.error(msg);
}
window.onerror = (m,src,l,c) => fail("JS error: "+m+"  @"+l+":"+c);
window.addEventListener("unhandledrejection", e =>
  fail("unhandled promise: "+((e.reason&&e.reason.message)||e.reason)));

const D = "../data/osm/";
const ATTRIB = '© OpenStreetMap contributors (ODbL)';

const J = p => fetch(p).then(r => { if(!r.ok) throw new Error(p+" "+r.status); return r.json(); });

/* ---------- linear referencing: mirrors pravah/corridor.py ---------- */
class Corridor {
  constructor(b){
    this.pts = b.polyline;              // [lon,lat]
    this.cum = b.cum_osm_km;
    this.ctrl = b.control_points;       // [officialKm, osmKm]
    this.stations = b.stations;
    this.officialKm = b.official_km;
  }
  _toOsm(km){
    const c = this.ctrl;
    if (km <= c[0][0]) return c[0][1];
    if (km >= c[c.length-1][0]) return c[c.length-1][1];
    let lo=0, hi=c.length-1;
    while (lo < hi-1){ const m=(lo+hi)>>1; if (c[m][0] <= km) lo=m; else hi=m; }
    const [k1,a1]=c[lo], [k2,a2]=c[lo+1];
    return k2===k1 ? a1 : a1 + (km-k1)/(k2-k1)*(a2-a1);
  }
  position(km){
    const t = this._toOsm(km), cum = this.cum;
    if (t <= 0) return this.pts[0];
    if (t >= cum[cum.length-1]) return this.pts[this.pts.length-1];
    let lo=0, hi=cum.length-1;
    while (lo < hi-1){ const m=(lo+hi)>>1; if (cum[m] <= t) lo=m; else hi=m; }
    const span = cum[lo+1]-cum[lo], f = span>0 ? (t-cum[lo])/span : 0;
    const a=this.pts[lo], b=this.pts[lo+1];
    return [a[0]+f*(b[0]-a[0]), a[1]+f*(b[1]-a[1])];
  }
  segmentFor(km){
    const s=this.stations;
    for (let i=0;i<s.length-1;i++) if (km>=s[i].cum_km && km<=s[i+1].cum_km) return [s[i],s[i+1]];
    return null;
  }
}

/* train chainage at time t (seconds) */
function kmAt(tr, t){
  const p = tr.pts;
  if (t < p[0][0] || t > p[p.length-1][0]) return null;
  let lo=0, hi=p.length-1;
  while (lo < hi-1){ const m=(lo+hi)>>1; if (p[m][0] <= t) lo=m; else hi=m; }
  const dt = p[lo+1][0]-p[lo][0];
  const f = dt>0 ? (t-p[lo][0])/dt : 0;
  const km = p[lo][1] + f*(p[lo+1][1]-p[lo][1]);
  const spd = dt>0 ? Math.abs(p[lo+1][1]-p[lo][1])/(dt/3600) : 0;
  return [km, spd];
}

const hhmm = s => {
  const d = Math.floor(s/86400), r = ((s%86400)+86400)%86400;
  return [String(Math.floor(r/3600)).padStart(2,"0")+":"+String(Math.floor(r%3600/60)).padStart(2,"0"), d];
};

(async function(){
  let linref, replay, tracks, places, water, waterways, roads, coast;
  try {
    [linref, replay, tracks, places, water, waterways, roads, coast] = await Promise.all([
      J(D+"linref.json"), J("data/replay.json"), J(D+"corridor_tracks.geojson"),
      J(D+"basemap/places.geojson"), J(D+"basemap/water.geojson"),
      J(D+"basemap/waterways.geojson"), J(D+"basemap/roads.geojson"),
      J(D+"basemap/coastline.geojson"),
    ]);
  } catch(e){
    const el = document.getElementById("loading");
    el.style.padding = "24px"; el.style.textAlign = "center";
    el.textContent = "could not load data: " + e.message
      + "  —  serve the repository ROOT (python -m http.server 8000) and open /web/";
    return;
  }


  const corridor = new Corridor(linref);
  document.getElementById("nday").textContent = replay.day;

  const stationsFC = { type:"FeatureCollection", features: corridor.stations.map(s => ({
    type:"Feature",
    properties:{ code:s.code, name:s.name, km:s.cum_km,
                 major: /JN|JUNCTION/i.test(s.name) ? 1 : 0 },
    geometry:{ type:"Point", coordinates:[s.lon, s.lat] }
  }))};

  let map;
  try {
  map = new maplibregl.Map({
    container:"map",
    attributionControl:{ compact:false, customAttribution:ATTRIB },
    center:[83.80,18.33], zoom:7.6, minZoom:6, maxZoom:15,
    style:{
      version:8,
      // Only the corridor is in the initial style. The basemap context
      // layers are several megabytes of GeoJSON and holding up style load
      // on them leaves the page blank; they are added after load instead.
      sources:{
        tracks:{type:"geojson",data:tracks},
        stations:{type:"geojson",data:stationsFC},
        trains:{type:"geojson",data:{type:"FeatureCollection",features:[]}},
      },
      layers:[
        {id:"bg",type:"background",paint:{"background-color":"#0d1117"}},
        {id:"track-casing",type:"line",source:"tracks",
         layout:{"line-cap":"round","line-join":"round"},
         paint:{"line-color":"#0d1117","line-width":["interpolate",["linear"],["zoom"],7,3.5,13,9]}},
        {id:"track",type:"line",source:"tracks",
         layout:{"line-cap":"round","line-join":"round"},
         paint:{"line-color":["case",["==",["get","usage"],"main"],"#6e7b8b","#49535f"],
                "line-width":["interpolate",["linear"],["zoom"],7,1.2,13,4]}},
        {id:"station",type:"circle",source:"stations",
         paint:{"circle-radius":["interpolate",["linear"],["zoom"],
                  7,["case",["==",["get","major"],1],3.4,2],
                  13,["case",["==",["get","major"],1],7,4.5]],
                "circle-color":"#0d1117","circle-stroke-color":"#f0f6fc",
                "circle-stroke-width":["interpolate",["linear"],["zoom"],7,1,13,2]}},
        {id:"train",type:"circle",source:"trains",
         paint:{"circle-radius":["interpolate",["linear"],["zoom"],7,3.6,13,8],
                "circle-color":["match",["get","dir"],"DN","#4aa8ff","UP","#ffb84a","#3fb950"],
                "circle-stroke-color":"#0d1117","circle-stroke-width":1.5,
                "circle-opacity":.95}},
      ],
    },
  });
  } catch(err){ fail("map constructor threw: "+err.message); return; }
  window.__map = map;   // exposed for automated screenshot checks

  /* ---------------- clock ---------------- */
  const span = replay.time_span;
  const scrub = document.getElementById("scrub");
  scrub.min = span[0]; scrub.max = span[1]; scrub.value = Math.max(span[0], 21600);
  let t = +scrub.value, playing = false, speed = 300, last = 0;

  /* Draw a list of {id,type,dir,km,speed}. The list comes from the server
     when a live feed is connected, and is computed locally otherwise, so
     both paths render through exactly the same code. */
  function draw(list, at){
    const feats = [];
    let dn=0, up=0;
    for (const tr of list){
      const [lon, lat] = corridor.position(tr.km);
      feats.push({type:"Feature",
        properties:{id:tr.id, type:tr.type, dir:tr.dir,
                    km:(+tr.km).toFixed(1), spd:(+tr.speed).toFixed(0)},
        geometry:{type:"Point", coordinates:[lon, lat]}});
      tr.dir === "DN" ? dn++ : up++;
    }
    const src = map.getSource("trains");
    if (src) src.setData({type:"FeatureCollection", features:feats});
    const [hm, day] = hhmm(at);
    document.getElementById("clock").firstChild.nodeValue = hm;
    document.getElementById("daytag").textContent = day ? " +"+day+"d" : "";
    document.getElementById("nrun").textContent = feats.length;
    document.getElementById("ndir").textContent = dn+" / "+up;
  }

  function render(){
    const list = [];
    for (const tr of replay.trains){
      const r = kmAt(tr, t);
      if (!r) continue;
      list.push({id:tr.id, type:tr.type, dir:tr.dir, km:r[0], speed:r[1]});
    }
    draw(list, t);
  }

  function loop(ts){
    if (live){ last = 0; requestAnimationFrame(loop); return; }
    if (playing){
      if (last) t += (ts-last)/1000*speed;
      last = ts;
      if (t > span[1]) t = span[0];
      scrub.value = t;
      render();
    } else last = 0;
    requestAnimationFrame(loop);
  }

  /* ---------------- live feed ---------------- */
  let ws = null, live = false;
  const feedTag = document.getElementById("nfeed");

  function setFeed(label, ok){
    feedTag.textContent = label;
    feedTag.style.color = ok ? "#3fb950" : "#8b949e";
  }
  setFeed("local replay", false);

  function send(cmd){
    if (live && ws && ws.readyState === 1) { ws.send(JSON.stringify(cmd)); return true; }
    return false;
  }

  function connect(){
    const proto = location.protocol === "https:" ? "wss" : "ws";
    try { ws = new WebSocket(proto+"://"+location.host+"/ws/live"); }
    catch(e){ return; }

    ws.onopen = () => { live = true; setFeed("live", true); };
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "hello"){
        if (m.day) document.getElementById("nday").textContent = m.day;
        return;
      }
      if (m.type !== "state") return;
      t = m.t;
      scrub.value = t;
      playing = !!m.playing;
      const pb = document.getElementById("play");
      pb.textContent = playing ? "❚❚ pause" : "▶ play";
      pb.classList.toggle("on", playing);
      draw(m.trains, m.t);
    };
    ws.onclose = () => {
      if (live) setFeed("local replay (disconnected)", false);
      live = false;
    };
    ws.onerror = () => { live = false; };
  }
  connect();

  document.getElementById("play").onclick = e => {
    if (send({cmd: playing ? "pause" : "play"})) return;   // server echoes state
    playing = !playing; last = 0;
    e.target.textContent = playing ? "❚❚ pause" : "▶ play";
    e.target.classList.toggle("on", playing);
  };
  scrub.oninput = e => {
    t = +e.target.value;
    if (!send({cmd:"seek", t})) render();
  };
  document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
    speed = +b.dataset.s;
    document.querySelectorAll(".spd").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    send({cmd:"speed", speed});
  });

  /* ---------------- interaction ---------------- */
  const info = document.getElementById("info");
  map.on("click","train", e => {
    const p = e.features[0].properties;
    const seg = corridor.segmentFor(+p.km);
    info.style.display = "block";
    document.getElementById("i-id").textContent = p.id;
    document.getElementById("i-type").textContent = p.type;
    document.getElementById("i-dir").textContent = p.dir === "DN" ? "down" : "up";
    document.getElementById("i-km").textContent = p.km + " km";
    document.getElementById("i-spd").textContent = p.spd + " km/h";
    document.getElementById("i-seg").textContent = seg ? seg[0].code+" – "+seg[1].code : "—";
  });
  map.on("click", e => {
    if (!map.queryRenderedFeatures(e.point,{layers:["train"]}).length) info.style.display="none";
  });
  map.on("mouseenter","train",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","train",()=>map.getCanvas().style.cursor="");

  /* Station labels as DOM markers. A vector style needs a glyph server to
     render text, and we deliberately ship no tile or glyph server so the
     map works entirely offline — so labels are plain HTML instead. */
  function addLabels(){
    for (const s of corridor.stations){
      const major = /JN|JUNCTION/i.test(s.name);
      const el = document.createElement("div");
      el.className = "stn-label" + (major ? " major" : "");
      el.textContent = major ? s.name.replace(/\s*JN\.?$/i,"") : s.code;
      el.title = s.name + " · " + s.cum_km.toFixed(2) + " km";
      new maplibregl.Marker({element:el, anchor:"left", offset:[8,0]})
        .setLngLat([s.lon, s.lat]).addTo(map);
    }
    const upd = () => {
      const z = map.getZoom();
      document.querySelectorAll(".stn-label").forEach(el => {
        el.style.display = (z >= 8.6 || el.classList.contains("major")) ? "" : "none";
      });
    };
    map.on("zoom", upd); upd();
  }

  map.on("error", e => fail("map error: " + (e && e.error ? e.error.message : e)));

  // If the style never finishes, say so rather than hanging on "loading".
  const watchdog = setTimeout(() => {
    if (!map.loaded()) fail("map did not finish loading - open the browser console (F12) and report the first red error");
  }, 12000);

  function addContext(){
    const defs = [
      ["water", water, {id:"water",type:"fill",source:"water",
        paint:{"fill-color":"#15283d","fill-opacity":.85}}],
      ["waterways", waterways, {id:"waterways",type:"line",source:"waterways",
        paint:{"line-color":"#1d3a55",
               "line-width":["interpolate",["linear"],["zoom"],7,.4,12,1.6]}}],
      ["coast", coast, {id:"coast",type:"line",source:"coast",
        paint:{"line-color":"#1f4060","line-width":1.2}}],
      ["roads", roads, {id:"roads",type:"line",source:"roads",
        paint:{"line-color":"#262c36",
               "line-width":["interpolate",["linear"],["zoom"],7,.4,12,2]}}],
    ];
    for (const [id, data, layer] of defs){
      try {
        map.addSource(id, {type:"geojson", data});
        map.addLayer(layer, "track-casing");   // keep context beneath the railway
      } catch(err){ console.warn("context layer "+id+" skipped:", err.message); }
    }
  }

  map.on("load", () => {
    clearTimeout(watchdog);
    const el = document.getElementById("loading");
    if (el) el.remove();
    addContext();
    map.fitBounds([[83.10,17.80],[84.55,18.85]],{padding:70,duration:0});
    addLabels();
    render();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
